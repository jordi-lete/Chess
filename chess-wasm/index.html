<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chess WASM Test</title>
</head>
<body>
  <h1>Chess Test</h1>
  <button onclick="init()">Start Game</button>
  <script src="chess.js"></script>
  <script>
    async function init() {
      const Module = await ChessModule();
      Module._init_game();
      const turn = Module._get_current_turn();
      alert("Game started. Turn: " + (turn === 0 ? "White" : "Black"));
    }
  </script>
</body>
</html>
